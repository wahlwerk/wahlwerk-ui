      <text class="label strong" x="100" y="26" text-anchor="start">0.6 px</text>
      <text class="label faint" x="100" y="39" text-anchor="start">hairline: edges, rules</text>
      <text class="label strong" x="100" y="56" text-anchor="start">1 px</text>
      <text class="label faint" x="100" y="69" text-anchor="start">frame: guides, marks, floor</text>
