  <style>#ww-c99e46c0 .construction{fill:none;stroke:#cdcac1;stroke-width:1.0;stroke-dasharray:2 2}#ww-c99e46c0 .dimension{fill:none;stroke:#a7a49b;stroke-width:1.0}#ww-c99e46c0 .structure{fill:none;stroke:#8a8d96;stroke-width:1.0}#ww-c99e46c0 .edged{stroke:#5d606a;stroke-width:0.6}#ww-c99e46c0 .subject{fill:#cfe2f2;stroke:#1d6fa8;stroke-width:1.0}#ww-c99e46c0 .subject-line{fill:none;stroke:#1d6fa8;stroke-width:1.4}#ww-c99e46c0 .subject-dot{fill:#1d6fa8}#ww-c99e46c0 .paper{fill:#ffffff;stroke:#8a8d96;stroke-width:1.0}#ww-c99e46c0 .arrow{fill:none;stroke:#5d606a;stroke-width:1.0}#ww-c99e46c0 .arrowhead{fill:#5d606a}#ww-c99e46c0 .rule{fill:none;stroke:#8a8d96;stroke-width:0.6}#ww-c99e46c0 .hollow{fill:#ffffff;stroke:#5d606a;stroke-width:0.6}#ww-c99e46c0 .neutral{fill:#a7a49b;stroke:#5d606a;stroke-width:0.6}#ww-c99e46c0 .label{font-family:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;font-size:11px}#ww-c99e46c0 .faint{fill:#a7a49b;color:#a7a49b}#ww-c99e46c0 .plain{fill:#5d606a;color:#5d606a}#ww-c99e46c0 .strong{fill:#1d1f24;color:#1d1f24}#ww-c99e46c0 .name{font-weight:600}#ww-c99e46c0.card{display:inline-block;font-family:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;font-size:11px;color:#5d606a;background:#ffffff;border:1px solid #dcd9d0;border-radius:6px;padding:8px 12px;line-height:1.35}#ww-c99e46c0 .card-title{margin-bottom:6px}#ww-c99e46c0 .card-body{display:flex;align-items:flex-end;gap:14px}#ww-c99e46c0 .legend{border-collapse:collapse;font:inherit;color:inherit}#ww-c99e46c0 .legend td{padding:1px 8px 1px 0;vertical-align:middle}#ww-c99e46c0 .legend td.num{padding-right:0;text-align:right}#ww-c99e46c0 .swatch{display:inline-block;width:8px;height:8px;border-radius:50%;box-sizing:border-box;border:0.6px solid #5d606a}</style>
  <g id="panel-band" transform="translate(0 22)" inkscape:groupmode="layer" inkscape:label="band">
    <g id="band.layer-structure" inkscape:groupmode="layer" inkscape:label="structure">
      <line class="rule" x1="10" y1="22" x2="90" y2="22" />
      <line class="structure" x1="10" y1="52" x2="90" y2="52" />
    </g>
    <g id="band.layer-subject" inkscape:groupmode="layer" inkscape:label="subject">
